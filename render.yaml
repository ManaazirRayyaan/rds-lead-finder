services:
  - type: web
    name: rds-lead-finder
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_HOURS
        value: "12"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: rds-lead-finder-db
          property: connectionString
databases:
  - name: rds-lead-finder-db
    plan: free
